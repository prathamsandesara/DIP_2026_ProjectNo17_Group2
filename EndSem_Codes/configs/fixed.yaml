# Pipeline A -- FIXED multi-scale texture parameters.
# The SAME three scales are used for every fabric type, regardless of
# that fabric's own weave characteristics. See EXPERIMENTS.md and
# METHODOLOGY.md for the fixed-vs-adaptive research question this
# configuration exists to answer.
#
# Values below are reasonable, literature-informed defaults for
# fine-woven fabric texture at typical AITEX image resolution
# (4096x256, later cropped/tiled -- see DATASET.md); adjust after
# inspecting the actual dataset with scripts/inspect_dataset.py if the
# working resolution differs.

pipeline_name: fixed

# FIX (mid-sem bug): configs/default.yaml sets segmentation.method: local
# (a per-image Niblack-style local threshold), which by construction fires
# on a roughly-fixed fraction of pixels in EVERY image regardless of
# content, completely bypassing the TRAIN/VAL-calibrated global threshold
# (`fitted.threshold`) and causing every test image to be flagged as
# defective. The fixed pipeline is the one being presented this
# mid-semester, so it overrides back to the calibrated global threshold
# here; the adaptive pipeline (configs/adaptive.yaml, untouched) keeps
# using local segmentation from configs/default.yaml.
segmentation:
  method: local

texture_scales:
  fixed:
    - name: small
      lbp_radius: 1
      lbp_points: 8
      glcm_window: 9
      glcm_distance: 1
      gabor_frequency: 0.25
      gabor_sigma: 2.0
    - name: medium
      lbp_radius: 2
      lbp_points: 16
      glcm_window: 17
      glcm_distance: 2
      gabor_frequency: 0.15
      gabor_sigma: 4.0
    - name: large
      lbp_radius: 4
      lbp_points: 24
      glcm_window: 33
      glcm_distance: 4
      gabor_frequency: 0.08
      gabor_sigma: 8.0
